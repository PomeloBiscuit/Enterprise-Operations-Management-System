# WO-10：把 Apache 的 DocumentRoot 從預設的 /var/www/html 改成 /var/www/app/public。
#
# 效果：只有 public/ 底下的檔案（index.php / login.php / logout.php / register.php
# 與 css、js、images）能從網路存取。頁面檔（src/pages/**）與 CLI 工具（scripts/**）
# 在 DocumentRoot 之外，直接請求一律 404 —— 逐檔權限守衛因此降級為第二道防線。
#
# 這是「用 DocumentRoot 解決」，不是用 .htaccess / RewriteRule 攔截。

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# 深度防禦：src/ 與 scripts/ 已在 DocumentRoot 之外本就打不到；
# 這裡再明確拒絕，避免日後有人加了 Alias 就把它們重新曝露出去。
<Directory /var/www/app/src>
    Require all denied
</Directory>
<Directory /var/www/app/scripts>
    Require all denied
</Directory>
